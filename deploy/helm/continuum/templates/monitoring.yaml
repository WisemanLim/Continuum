{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "continuum.fullname" . }}
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "continuum.selector" . | nindent 6 }}
  endpoints:
    - port: api
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- with .Values.metrics.serviceMonitor.bearerTokenSecret }}
      authorization: { type: Bearer, credentials: { name: {{ .name }}, key: {{ .key }} } }
      {{- end }}
{{- end }}
{{- if .Values.metrics.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "continuum.fullname" . }}-dashboard
  labels:
    {{- include "continuum.labels" . | nindent 4 }}
    {{- toYaml .Values.metrics.grafanaDashboard.labels | nindent 4 }}
data:
  continuum-dashboard.json: |-
    {{- .Files.Get "dashboards/continuum-dashboard.json" | nindent 4 }}
{{- end }}
