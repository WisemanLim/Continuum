apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum.fullname" . }}
  labels: {{- include "continuum.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "continuum.selector" . | nindent 4 }}
  ports:
    - { name: api, port: {{ .Values.service.apiPort }}, targetPort: api }
{{- if .Values.agent.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "continuum.fullname" . }}-agent
  labels: {{- include "continuum.labels" . | nindent 4 }}
  {{- with .Values.agentService.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agentService.type }}
  selector: {{- include "continuum.selector" . | nindent 4 }}
  ports:
    - { name: agent, port: {{ .Values.service.agentPort }}, targetPort: agent }
{{- end }}
