[package]
name = "continuum-desktop"
version = "0.0.0"
edition = "2021"
description = "Continuum desktop shell (Tauri v2). Go controller/agent run as sidecar binaries."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
