# Tag-triggered release (FR-R03, R05, S08, X06, NFR-S04; PRD §15.3 ①–⑦):
# test gate → signed/notarized binaries + packages + images (goreleaser) → SBOM + provenance →
# signed desktop bundles (Tauri) → extension zip (+ Chrome Web Store / Edge Add-ons when credentials exist).
# All credentials are GitHub environment secrets of the `release` environment; none live in the repository.
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      store_channel:
        description: "Chrome Web Store target: default (public) or trustedTesters (private tester channel)"
        default: trustedTesters
        type: choice
        options: [trustedTesters, default]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: FR-P08 spillover gate
        run: go test ./internal/placement ./internal/transfer -run 'FRP08' -count=1 -v
      - run: go test ./... -count=1
      - name: dependency licenses known (FR-R07)
        run: go run ./tools/notices -o /tmp/notices.md

  binaries:
    needs: gate
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write      # GitHub release
      packages: write      # ghcr.io images
      id-token: write      # Sigstore keyless signing + provenance
      attestations: write
    env: # step `if:` cannot read secrets directly — expose presence flags only
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Import GPG key (Linux repository signatures)
        if: env.HAS_GPG == 'true'
        env: { GPG_PRIVATE_KEY: "${{ secrets.GPG_PRIVATE_KEY }}" }
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Install jsign (Windows Authenticode via Azure Trusted Signing)
        if: env.HAS_AZURE_SIGNING == 'true'
        run: |
          curl -fsSLo /tmp/jsign.deb https://github.com/ebourg/jsign/releases/download/7.1/jsign_7.1_all.deb
          sudo apt-get install -y /tmp/jsign.deb
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Build the web UI for the controller image
        run: pnpm install --frozen-lockfile && pnpm --filter @continuum/web build
      - uses: goreleaser/goreleaser-action@v7
        with: { distribution: goreleaser, version: "~> v2", args: check }
      - uses: goreleaser/goreleaser-action@v7
        with: { distribution: goreleaser, version: "~> v2", args: release --clean }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_ACCESS_TOKEN: ${{ secrets.AZURE_ACCESS_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
      - name: Build provenance (SLSA) for archives and packages
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

  desktop:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, args: "--target universal-apple-darwin" }
          - { os: windows-2022, args: "" }
          - { os: ubuntu-22.04, args: "" }
    runs-on: ${{ matrix.os }}
    environment: release
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      HAS_APPLE_KEY: ${{ secrets.MACOS_NOTARY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @continuum/web build
      - run: pnpm --filter @continuum/desktop sidecar
      - name: Write the notarytool API key
        if: matrix.os == 'macos-14' && env.HAS_APPLE_KEY == 'true'
        env: { KEY: "${{ secrets.MACOS_NOTARY_KEY }}" }
        run: echo "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID + notarization (Tauri reads these)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          # updater signature (minisign key generated with `tauri signer generate`)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  extension:
    needs: gate
    runs-on: ubuntu-22.04
    environment: release
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      HAS_STORE: ${{ secrets.CHROME_EXTENSION_ID != '' || secrets.EDGE_PRODUCT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @continuum/extension exec wxt zip
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "apps/extension/.output/*.zip" }
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload "${{ github.ref_name }}" apps/extension/.output/*.zip --clobber
      # FR-X06: Chrome Web Store + Edge Add-ons; skipped when the store credentials are not configured
      - name: Publish to Chrome Web Store / Edge Add-ons
        if: env.HAS_STORE == 'true'
        working-directory: apps/extension
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ inputs.store_channel || 'trustedTesters' }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          args=""
          [ -n "$CHROME_EXTENSION_ID" ] && args="$args --chrome-zip .output/*-chrome.zip"
          [ -n "$EDGE_PRODUCT_ID" ] && args="$args --edge-zip .output/*-chrome.zip"
          pnpm exec wxt submit $args
